<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head><body>
<script type="module">
// Mascota original del look «producto-3d-mascota»: «Chispa», una criatura cósmica de vinilo blando (cuerpo de gominola,
// ojos grandes con brillo, mofletes, antenas con estrella, bufanda de punto) saludando y girada hacia el producto.
// Se renderiza con la luz de la marca: recorte azul a la izquierda y violeta a la derecha (los del fondo del banner).
import { THREE, preparar, luces, encuadrar, sombras } from './comun.js'
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js'
const { r, s } = preparar({ entorno: .42 })
luces(s, { principal: 1.75, relleno: .35, azul: 9, violeta: 9 })

const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t) }
const mascota = new THREE.Group(); s.add(mascota)

// Cuerpo: esfera deformada en gominola (más ancha abajo, base algo plana) con la panza algo más clara
const g = new THREE.SphereGeometry(1, 200, 150), pos = g.attributes.position
const col = new Float32Array(pos.count * 3), base = new THREE.Color('#7357ff'), panza = new THREE.Color('#a996ff'), alto = new THREE.Color('#6a4cf6'), t = new THREE.Color()
for (let i = 0; i < pos.count; i++) {
  let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i)
  const ancho = 1 + .12 * -y
  x *= ancho; z *= ancho * .9; let yy = y * 1.12
  if (yy < -.8) yy = -.8 + (yy + .8) * .55
  pos.setXYZ(i, x, yy, z)
  const w = sm(.5, .9, z / (ancho * .9)) * sm(-.25, -.6, y) * .8
  t.copy(base).lerp(alto, sm(.2, 1, y)).lerp(panza, w)
  col.set([t.r, t.g, t.b], i * 3)
}
g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.computeVertexNormals()
const params = { roughness: .5, sheen: 1, sheenRoughness: .35, sheenColor: '#d9ccff', clearcoat: .22, clearcoatRoughness: .4 }
const vinilo = new THREE.MeshPhysicalMaterial({ vertexColors: true, ...params })
const cuerpo = new THREE.Mesh(g, vinilo); mascota.add(cuerpo); cuerpo.updateMatrixWorld(true)
const morado = new THREE.MeshPhysicalMaterial({ color: '#7357ff', ...params })

const ray = new THREE.Raycaster()
const pegar = (x, y) => { ray.set(new THREE.Vector3(x, y, 5), new THREE.Vector3(0, 0, -1)); const h = ray.intersectObject(cuerpo)[0]; return { p: h.point, n: h.face.normal.clone().normalize() } }
const orientar = (o, n) => o.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), n)

// Ojos: esferas oscuras con laca y dos puntos de brillo
const ojoMat = new THREE.MeshPhysicalMaterial({ color: '#0f0b29', roughness: .12, clearcoat: 1, clearcoatRoughness: .03 })
const brillo = new THREE.MeshBasicMaterial({ color: '#ffffff', toneMapped: false })
for (const sx of [-1, 1]) {
  const { p, n } = pegar(.33 * sx, .36)
  const ojo = new THREE.Group(); ojo.position.copy(p).addScaledVector(n, -.04); orientar(ojo, n)
  const e = new THREE.Mesh(new THREE.SphereGeometry(.168, 96, 64), ojoMat); e.scale.set(1, 1.18, .62); ojo.add(e)
  const b1 = new THREE.Mesh(new THREE.SphereGeometry(.046, 32, 24), brillo); b1.position.set(-.055, .075, .092); ojo.add(b1)
  const b2 = new THREE.Mesh(new THREE.SphereGeometry(.021, 24, 16), brillo); b2.position.set(.055, -.065, .094); ojo.add(b2)
  mascota.add(ojo)
  const m = pegar(.56 * sx, .13), mo = new THREE.Mesh(new THREE.SphereGeometry(.1, 48, 32), new THREE.MeshPhysicalMaterial({ color: '#ff8fcf', roughness: .85, transparent: true, opacity: .78 }))
  mo.position.copy(m.p).addScaledVector(m.n, -.012); orientar(mo, m.n); mo.scale.set(1.35, .8, .2); mascota.add(mo)
}
// Sonrisa
{ const { p, n } = pegar(0, .16); const bo = new THREE.Mesh(new THREE.TorusGeometry(.088, .024, 24, 64, Math.PI), ojoMat)
  bo.position.copy(p).addScaledVector(n, -.004); orientar(bo, n); bo.rotateZ(Math.PI); mascota.add(bo) }

// Antenas con estrella en la punta
const estrella = (() => { const sh = new THREE.Shape(); for (let i = 0; i <= 10; i++) { const a = Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? .064 : .145; const px = Math.cos(a) * rr, py = Math.sin(a) * rr; i ? sh.lineTo(px, py) : sh.moveTo(px, py) }
  const ge = new THREE.ExtrudeGeometry(sh, { depth: .04, bevelEnabled: true, bevelThickness: .038, bevelSize: .032, bevelSegments: 8, curveSegments: 12 }); ge.center(); return ge })()
const oro = new THREE.MeshPhysicalMaterial({ color: '#ffd27a', emissive: '#ffb84a', emissiveIntensity: .22, roughness: .3, clearcoat: .8, clearcoatRoughness: .15 })
for (const sx of [-1, 1]) {
  ray.set(new THREE.Vector3(.3 * sx, 5, 0), new THREE.Vector3(0, -1, 0)); const h = ray.intersectObject(cuerpo)[0].point
  const fin = new THREE.Vector3(.58 * sx, h.y + .5, .02)
  const curva = new THREE.QuadraticBezierCurve3(h.clone().add(new THREE.Vector3(0, -.05, 0)), new THREE.Vector3(.34 * sx, h.y + .36, 0), fin)
  mascota.add(new THREE.Mesh(new THREE.TubeGeometry(curva, 64, .042, 20), morado))
  const st = new THREE.Mesh(estrella, oro); st.position.copy(fin).add(new THREE.Vector3(.02 * sx, .08, 0)); st.rotation.set(-.1, sx * .35, sx * -.25); mascota.add(st)
}

// Brazos (uno saluda) y piernas cortas
const brazo = (x, y, rz, rx = 0, largo = .34, z = .06, grosor = .135) => { const gr = new THREE.Group(); gr.position.set(x, y, z); const m = new THREE.Mesh(new THREE.CapsuleGeometry(grosor, largo, 24, 48), morado); m.position.y = -.27 - (largo - .34) / 2; gr.add(m); const mano = new THREE.Mesh(new THREE.SphereGeometry(.158, 48, 32), morado); mano.position.y = -.27 - largo / 2 - .03; mano.scale.set(1, .92, .9); gr.add(mano); gr.rotation.set(rx, 0, rz); mascota.add(gr) }
brazo(-.86, -.34, -.42, .2)
brazo(.8, -.06, 2.2, -.45, .3, .16, .148)
for (const sx of [-1, 1]) { const pi = new THREE.Mesh(new THREE.CapsuleGeometry(.18, .12, 24, 48), morado); pi.position.set(.36 * sx, -1.03, .05); pi.scale.set(1, 1, 1.2); mascota.add(pi) }

// Bufanda de punto (crema con dos rayas del acento): toro con costillas y dos caídas por delante
const lana = new THREE.MeshPhysicalMaterial({ color: '#f3ede2', roughness: .92, sheen: 1, sheenRoughness: .55, sheenColor: '#ffffff' })
const R = 1, rt = .118, YB = -.13
const tg = new THREE.TorusGeometry(R, rt, 48, 360), tp = tg.attributes.position, c0 = new THREE.Vector3(), pv = new THREE.Vector3()
for (let i = 0; i < tp.count; i++) { pv.fromBufferAttribute(tp, i); const u = Math.atan2(pv.y, pv.x); c0.set(Math.cos(u) * R, Math.sin(u) * R, 0); pv.sub(c0).multiplyScalar(1 + .1 * Math.pow(Math.abs(Math.sin(u * 70)), .6)).add(c0); tp.setXYZ(i, pv.x, pv.y, pv.z) }
tg.computeVertexNormals()
const bu = new THREE.Mesh(tg, lana); bu.rotation.x = Math.PI / 2; bu.position.y = YB; bu.scale.set(1.04, .95, 1); mascota.add(bu)
const raya = new THREE.MeshPhysicalMaterial({ color: '#6a4cf6', roughness: .88, sheen: .8, sheenColor: '#cbbcff' })
for (const yy of [-.058, .058]) { const ra = new THREE.Mesh(new THREE.TorusGeometry(1, .024, 16, 260), raya); ra.rotation.x = Math.PI / 2; ra.position.y = YB + yy; ra.scale.set(1.04 + .094, .95 + .094, 1); mascota.add(ra) }
sombras(mascota)
mascota.rotation.set(.04, -.42, .03)
mascota.updateMatrixWorld(true)
const c = encuadrar(mascota, { fov: 22, margen: .03, elevacion: .06 })
r.render(s, c); window.listo = true
</script></body></html>
