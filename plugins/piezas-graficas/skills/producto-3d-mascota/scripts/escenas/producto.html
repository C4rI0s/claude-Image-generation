<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head><body>
<script type="module">
// Producto del look «producto-3d-mascota»: torre gaming compacta blanca, sin marca. Carcasa lacada con biseles,
// frontal microperforado con franja de luz, lateral de cristal con interior blanco (placa, disipador con aro de luz,
// gráfica) y dos ventiladores de aro de luz, y patas. Se renderiza con la luz de la marca (recortes azul y violeta).
import { THREE, preparar, luces, encuadrar, sombras, estudioMarca, q } from './comun.js'
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js'
const { r, s } = preparar({ entorno: .55 })
if (q.get('estudio') !== 'neutro') { s.environment = estudioMarca(r); s.environmentIntensity = .62 }
const L = luces(s, { principal: 1.6, azul: 11, violeta: 11 })
// Recorte extra arriba-atrás para que el canto blanco dibuje una línea de color
{ const k = new THREE.DirectionalLight('#7d6bff', 6); k.position.set(-1, 5, -4); s.add(k) }

const torre = new THREE.Group(); s.add(torre)
const AN = .86, AL = 2.08, FO = 1.5, R = .08, MARCO = .1   // ancho (x), alto (y), fondo (z)
const blanco = new THREE.MeshPhysicalMaterial({ color: '#f4f3f9', roughness: .3, clearcoat: .6, clearcoatRoughness: .18 })
const blancoMate = new THREE.MeshPhysicalMaterial({ color: '#e9e7f1', roughness: .62 })
const gris = new THREE.MeshPhysicalMaterial({ color: '#d9d6e4', roughness: .55 })
const negro = new THREE.MeshPhysicalMaterial({ color: '#141221', roughness: .42, metalness: .3 })
const luz = (c, i = 4) => new THREE.MeshStandardMaterial({ color: '#000000', emissive: c, emissiveIntensity: i })

const cuerpo = new THREE.Mesh(new RoundedBoxGeometry(AN - MARCO, AL, FO, 8, R), blanco); cuerpo.position.x = -MARCO / 2; torre.add(cuerpo)
const rr = (w, h, rad, hole) => { const p = hole ? new THREE.Path() : new THREE.Shape(), x = -w / 2, y = -h / 2
  p.moveTo(x + rad, y); p.lineTo(x + w - rad, y); p.quadraticCurveTo(x + w, y, x + w, y + rad); p.lineTo(x + w, y + h - rad); p.quadraticCurveTo(x + w, y + h, x + w - rad, y + h)
  p.lineTo(x + rad, y + h); p.quadraticCurveTo(x, y + h, x, y + h - rad); p.lineTo(x, y + rad); p.quadraticCurveTo(x, y, x + rad, y); return p }
const forma = rr(FO, AL, R, false); forma.holes.push(rr(FO - .13, AL - .13, .04, true))
const marco = new THREE.Mesh(new THREE.ExtrudeGeometry(forma, { depth: MARCO - .02, bevelEnabled: true, bevelThickness: .01, bevelSize: .008, bevelSegments: 4, curveSegments: 24 }), blanco)
marco.rotation.y = Math.PI / 2; marco.position.x = AN / 2 - MARCO; torre.add(marco)

// Interior blanco: hueco profundo (placa al fondo) para que el cristal tenga profundidad de verdad
const xi = -AN / 2 + .1   // la placa base va casi en la pared izquierda: el interior se ve hondo
const hueco = new THREE.Group(); torre.add(hueco)
const placa = new THREE.Mesh(new THREE.PlaneGeometry(FO - .13, AL - .13), gris); placa.rotation.y = Math.PI / 2; placa.position.x = xi; hueco.add(placa)
const suelo = new THREE.Mesh(new THREE.PlaneGeometry(AN - .1, FO - .13), blancoMate); suelo.rotation.x = -Math.PI / 2; suelo.position.set(xi + (AN - .1) / 2, -AL / 2 + .065, 0); hueco.add(suelo)
const techo = new THREE.Mesh(new THREE.PlaneGeometry(AN - .1, FO - .13), blancoMate); techo.rotation.x = Math.PI / 2; techo.position.set(xi + (AN - .1) / 2, AL / 2 - .065, 0); hueco.add(techo)
const frenteI = new THREE.Mesh(new THREE.PlaneGeometry(AN - .1, AL - .13), blancoMate); frenteI.rotation.y = Math.PI; frenteI.position.set(xi + (AN - .1) / 2, 0, FO / 2 - .065); hueco.add(frenteI)
const atrasI = new THREE.Mesh(new THREE.PlaneGeometry(AN - .1, AL - .13), blancoMate); atrasI.position.set(xi + (AN - .1) / 2, 0, -FO / 2 + .065); hueco.add(atrasI)
// El cuerpo macizo taparía el hueco: lo vaciamos dejando solo las paredes (cuerpo = carcasa visible por fuera)
cuerpo.material = blanco; cuerpo.visible = false
const pared = (w, h, d, x, y, z) => { const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 6, Math.min(R, w / 2, h / 2, d / 2) * .99), blanco); m.position.set(x, y, z); torre.add(m) }
pared(.1, AL, FO, -AN / 2 + .05, 0, 0)                          // pared izquierda
pared(AN - .02, .065, FO, -.01, AL / 2 - .0325, 0)               // techo
pared(AN - .02, .065, FO, -.01, -AL / 2 + .0325, 0)              // suelo
pared(AN - .02, AL, .065, -.01, 0, FO / 2 - .0325)               // frontal
pared(AN - .02, AL, .065, -.01, 0, -FO / 2 + .0325)              // trasera

// Ventilador blanco con aro de luz (mira hacia +x)
const aspa = (() => { const sh = new THREE.Shape(); sh.moveTo(-.022, 0); sh.quadraticCurveTo(-.05, .12, -.02, .2); sh.quadraticCurveTo(.04, .22, .06, .17); sh.quadraticCurveTo(.03, .08, .022, 0); sh.lineTo(-.022, 0)
  return new THREE.ExtrudeGeometry(sh, { depth: .006, bevelEnabled: true, bevelThickness: .003, bevelSize: .003, bevelSegments: 2, curveSegments: 16 }) })()
const matAspa = new THREE.MeshPhysicalMaterial({ color: '#f2f0fa', roughness: .35, clearcoat: .5 })
const ventilador = (c, tam = 1) => { const v = new THREE.Group()
  v.add(new THREE.Mesh(new RoundedBoxGeometry(.05, .62, .62, 4, .05), blanco))
  const aro = new THREE.Mesh(new THREE.TorusGeometry(.27, .02, 24, 160), luz(c)); aro.rotation.y = Math.PI / 2; aro.position.x = .028; v.add(aro)
  const boca = new THREE.Mesh(new THREE.CylinderGeometry(.255, .255, .052, 96, 1, true), blancoMate); boca.rotation.z = Math.PI / 2; v.add(boca)
  const buje = new THREE.Mesh(new THREE.CylinderGeometry(.075, .075, .05, 64), blanco); buje.rotation.z = Math.PI / 2; buje.position.x = .012; v.add(buje)
  for (let i = 0; i < 9; i++) { const g = new THREE.Group(); g.rotation.x = i / 9 * Math.PI * 2; const a = new THREE.Mesh(aspa, matAspa); a.rotation.y = Math.PI / 2 - .55; a.position.set(.004, .05, 0); g.add(a); v.add(g) }
  v.scale.setScalar(tam); return v }
// Dos ventiladores en el frontal interior (de canto, con su aro) y uno arriba: dan el brillo a través del cristal
const v1 = ventilador('#7a5cff', .95); v1.rotation.y = -Math.PI / 2; v1.position.set(.0, .52, -FO / 2 + .1); torre.add(v1)
const v2 = ventilador('#5b6dff', .95); v2.rotation.y = -Math.PI / 2; v2.position.set(.0, -.12, -FO / 2 + .1); torre.add(v2)
// Luz de color dentro de la caja (la de los aros): tiñe el interior blanco de violeta y azul
const li1 = new THREE.PointLight('#8b6bff', 4.5, 2.6, 1.5); li1.position.set(.15, .55, .1); torre.add(li1)
const li2 = new THREE.PointLight('#5b6dff', 4, 2.6, 1.5); li2.position.set(.15, -.4, .2); torre.add(li2)
// Disipador líquido: bloque redondo con aro de luz, sobre la placa
const bomba = new THREE.Group(); const cuerpoB = new THREE.Mesh(new THREE.CylinderGeometry(.12, .12, .1, 96), blanco); cuerpoB.rotation.z = Math.PI / 2; bomba.add(cuerpoB)
const aroB = new THREE.Mesh(new THREE.TorusGeometry(.1, .012, 16, 96), luz('#8b6bff', 2.8)); aroB.rotation.y = Math.PI / 2; aroB.position.x = .052; bomba.add(aroB)
const tapa = new THREE.Mesh(new THREE.CylinderGeometry(.085, .085, .012, 64), new THREE.MeshPhysicalMaterial({ color: '#d8d4e8', roughness: .2, clearcoat: 1 })); tapa.rotation.z = Math.PI / 2; tapa.position.x = .052; bomba.add(tapa)
bomba.position.set(xi + .06, .45, -.12); torre.add(bomba)
for (const dz of [-.05, .05]) { const tubo = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(xi + .1, .5, -.12 + dz), new THREE.Vector3(xi + .25, .7, -.05 + dz), new THREE.Vector3(xi + .3, .86, .25 + dz)]), 48, .022, 16), blancoMate); torre.add(tubo) }
// Memorias con canto de luz
for (let i = 0; i < 2; i++) { const ram = new THREE.Mesh(new RoundedBoxGeometry(.1, .42, .02, 2, .006), blanco); ram.position.set(xi + .05, .45, .14 + i * .045); torre.add(ram)
  const l = new THREE.Mesh(new THREE.BoxGeometry(.008, .4, .016), luz('#a184ff', 2)); l.position.set(xi + .1, .45, .14 + i * .045); torre.add(l) }
// Gráfica: caja blanca horizontal con franja de luz en el canto
const gpu = new THREE.Mesh(new RoundedBoxGeometry(.3, .22, .98, 5, .03), blanco); gpu.position.set(xi + .17, -.3, .08); torre.add(gpu)
const gpuB = new THREE.Mesh(new RoundedBoxGeometry(.012, .16, .9, 2, .005), negro); gpuB.position.set(xi + .322, -.3, .08); torre.add(gpuB)
const lg = new THREE.Mesh(new THREE.BoxGeometry(.006, .03, .9), luz('#8b6bff', 2.4)); lg.position.set(xi + .33, -.2, .08); torre.add(lg)
const fuente = new THREE.Mesh(new RoundedBoxGeometry(.6, .32, 1.2, 4, .02), blancoMate); fuente.position.set(-.05, -AL / 2 + .23, -.08); torre.add(fuente)

// Gráfica en montaje vertical, de cara al cristal: carcasa blanca, tres ventiladores con aro de luz y placa trasera
const gv = new THREE.Group(); gv.add(new THREE.Mesh(new RoundedBoxGeometry(.11, .86, .34, 5, .035), blanco))
for (let i = 0; i < 3; i++) { const vf = ventilador(['#8b6bff', '#6f6cff', '#5b6dff'][i], .43); vf.position.set(.04, -.27 + i * .27, 0); gv.add(vf) }
const lgv = new THREE.Mesh(new THREE.BoxGeometry(.112, .7, .008), luz('#8b6bff', 3)); lgv.position.set(0, 0, .172); gv.add(lgv)
gv.position.set(xi + .44, -.06, -.42); torre.add(gv)
// Cables blancos trenzados de la fuente a la placa
for (let i = 0; i < 4; i++) { const zc = .3 + i * .045, cv = new THREE.CatmullRomCurve3([new THREE.Vector3(xi + .2, -AL / 2 + .39, zc), new THREE.Vector3(xi + .26, -.45, zc + .02), new THREE.Vector3(xi + .1, .05, zc + .04), new THREE.Vector3(xi + .02, .2, zc + .02)])
  torre.add(new THREE.Mesh(new THREE.TubeGeometry(cv, 64, .016, 12), blancoMate)) }
// Reflejo del cristal: una banda diagonal suave (textura de degradado) justo delante del cristal
const cv2 = document.createElement('canvas'); cv2.width = 512; cv2.height = 512; const cx = cv2.getContext('2d')
const gr = cx.createLinearGradient(0, 512, 512, 0); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.38, 'rgba(255,255,255,0)'); gr.addColorStop(.46, 'rgba(255,255,255,.16)'); gr.addColorStop(.52, 'rgba(255,255,255,.05)'); gr.addColorStop(.6, 'rgba(255,255,255,.12)'); gr.addColorStop(.66, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(255,255,255,0)')
cx.fillStyle = gr; cx.fillRect(0, 0, 512, 512)
const tx = new THREE.CanvasTexture(cv2); tx.colorSpace = THREE.SRGBColorSpace
const refl = new THREE.Mesh(new THREE.PlaneGeometry(FO - .12, AL - .12), new THREE.MeshBasicMaterial({ map: tx, transparent: true, depthWrite: false, toneMapped: false }))
refl.rotation.y = Math.PI / 2; refl.position.x = AN / 2 - .035; torre.add(refl)
// Cristal (con transmisión: refleja el estudio y deja ver el interior)
const cristal = new THREE.Mesh(new THREE.BoxGeometry(.01, AL - .1, FO - .1), new THREE.MeshPhysicalMaterial({ color: '#ffffff', roughness: .02, metalness: 0, transmission: 1, thickness: .01, ior: 1.5, clearcoat: 1, clearcoatRoughness: .02, attenuationColor: '#cfc6ff', attenuationDistance: 2 }))
cristal.position.x = AN / 2 - .045; torre.add(cristal)

// Frontal: panel microperforado (agujeros instanciados) con franja de luz vertical en una ranura
const zf = FO / 2 + .001
const agujeros = new THREE.InstancedMesh(new THREE.CircleGeometry(.0078, 12), new THREE.MeshBasicMaterial({ color: '#3a3650' }), 5000)
let n = 0; const m4 = new THREE.Matrix4(), xr = -.02
for (let iy = 0; iy < 82 && n < 5000; iy++) for (let ix = 0; ix < 30 && n < 5000; ix++) { const x = -AN / 2 + .085 + ix * .024 + (iy % 2) * .012, y = -AL / 2 + .17 + iy * .0212
  if (Math.abs(x - xr) < .046 || x > AN / 2 - .085) continue; m4.makeTranslation(x, y, zf); agujeros.setMatrixAt(n++, m4) }
agujeros.count = n; torre.add(agujeros)
const ranura = new THREE.Mesh(new RoundedBoxGeometry(.056, AL - .3, .02, 3, .01), negro); ranura.position.set(xr, .01, FO / 2 - .004); torre.add(ranura)
const franja = new THREE.Mesh(new RoundedBoxGeometry(.03, AL - .36, .02, 3, .012), luz('#8b6bff', 6)); franja.position.set(xr, .01, FO / 2 + .002); torre.add(franja)
// Arriba: botón de encendido con anillo de luz, puertos y rejilla
const boton = new THREE.Mesh(new THREE.CylinderGeometry(.034, .034, .016, 48), blanco); boton.position.set(-.16, AL / 2 + .006, FO / 2 - .16); torre.add(boton)
const anillo = new THREE.Mesh(new THREE.TorusGeometry(.039, .0045, 12, 64), luz('#8b6bff', 3)); anillo.rotation.x = Math.PI / 2; anillo.position.set(-.16, AL / 2 + .004, FO / 2 - .16); torre.add(anillo)
for (const dx of [.0, .07]) { const pu = new THREE.Mesh(new RoundedBoxGeometry(.05, .01, .022, 2, .004), negro); pu.position.set(dx, AL / 2 + .002, FO / 2 - .16); torre.add(pu) }
for (let i = 0; i < 12; i++) { const sl = new THREE.Mesh(new RoundedBoxGeometry(.46, .01, .022, 2, .005), negro); sl.position.set(-.04, AL / 2 + .001, -FO / 2 + .2 + i * .065); torre.add(sl) }
for (const [x, z] of [[-AN / 2 + .1, FO / 2 - .14], [AN / 2 - .1, FO / 2 - .14], [-AN / 2 + .1, -FO / 2 + .14], [AN / 2 - .1, -FO / 2 + .14]]) {
  const p = new THREE.Mesh(new THREE.CylinderGeometry(.04, .05, .045, 32), negro); p.position.set(x, -AL / 2 - .0225, z); torre.add(p) }

sombras(torre); agujeros.castShadow = false; cristal.castShadow = false; refl.castShadow = false
torre.scale.x = -1; torre.rotation.y = .66   // espejo: cristal a la izquierda y frontal a la derecha (otro ángulo que la referencia)
torre.updateMatrixWorld(true)
const c = encuadrar(torre, { fov: 22, margen: .03, elevacion: .3 })
r.render(s, c); window.listo = true
</script></body></html>
